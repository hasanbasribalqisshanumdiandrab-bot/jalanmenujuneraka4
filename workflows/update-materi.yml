name: Update data materi
on:
  push:
    paths: ['materi/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Pasang OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind poppler-utils
          pip install pytesseract pillow python-pptx requests
      - name: Bangun data pencarian
        run: python materi_sync.py
      - name: Simpan hasil
        run: |
          git config user.name "materi-bot"
          git config user.email "materi-bot@users.noreply.github.com"
          git add data .ocr_cache.json
          git diff --cached --quiet || (git commit -m "update data materi" && git push)
